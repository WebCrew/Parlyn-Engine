name: Parlyn CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Structural and syntax checks
        run: npm run check

      - name: Build renderer
        run: npm run build:renderer:release
