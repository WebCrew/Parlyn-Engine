name: Publish unsigned Windows beta

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-unsigned-preview.yml
  workflow_dispatch:
    inputs:
      preview_tag:
        description: New prerelease tag; an existing release is never overwritten
        required: true
        type: string
        default: v0.5.0-beta.12
      preview_title:
        description: Public prerelease title
        required: true
        type: string
        default: Parlyn Engine v0.5.0 Beta 12 (unsigned)

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'WebCrew/Parlyn-Engine'
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      GH_TOKEN: ${{ github.token }}
      PREVIEW_TAG: ${{ inputs.preview_tag || 'v0.5.0-beta.12' }}
      PREVIEW_TITLE: ${{ inputs.preview_title || 'Parlyn Engine v0.5.0 Beta 12 (unsigned)' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build unsigned Windows beta
        run: npm run build:windows

      - name: Verify packaging and prepare portable test build
        shell: pwsh
        run: |
          ./scripts/verify-windows-artifacts.ps1 `
            -ArtifactDirectory release `
            -RequireSignature:$false

          $installer = Get-ChildItem -LiteralPath release -File -Filter "Parlyn-Engine-Setup-*.exe"
          if ($installer.Count -ne 1) {
            throw "Expected exactly one Parlyn installer."
          }

          $portable = "release/Parlyn-Engine-Portable-0.5.0-beta.12-x64.zip"
          if (-not (Test-Path -LiteralPath "release/win-unpacked/Parlyn Engine.exe")) {
            throw "Packaged Parlyn executable was not found for the portable build."
          }
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath $portable -CompressionLevel Optimal

          $artifacts = @($installer[0], (Get-Item -LiteralPath $portable))
          $checksums = foreach ($artifact in $artifacts) {
            $hash = Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($artifact.Name)"
          }
          $checksums | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8

      - name: Prepare release notes
        shell: pwsh
        run: |
          @"
          # Parlyn Engine v0.5.0 Beta 12

          This unsigned Windows beta introduces Parlyn's first Transform Snap
          foundation. A persistent viewport toggle applies predictable increments
          of 0.5 units for Move, 15 degrees for Rotate and 0.1 for Scale while
          preserving Parlyn's existing 2.5D axis limits, history and editor state.
          The portable ZIP creates no Windows installation or uninstall entry and
          remains the preferred unsigned test path.

          **Important:** This beta is unsigned and may be blocked by Windows
          Smart App Control. Download it only from this official release, verify
          the published SHA-256 checksum, and do not bypass a Windows security
          decision. It must not be described as trusted, digitally signed,
          SignPath-signed or Foundation-certified.

          The repository provides reproducible packaging, required checks,
          documented maintainer acceptance and SHA-256 verification. A public
          code-signing identity may be added later when operationally justified
          and sustainably funded. This release is not signed by SignPath or any
          other public certificate provider.

          Maintainer acceptance instructions:
          https://github.com/WebCrew/Parlyn-Engine/blob/main/docs/MAINTAINER-ACCEPTANCE-v0.5.0-beta.12.md
          "@ | Set-Content -LiteralPath release/PREVIEW-NOTES.md -Encoding utf8

      - name: Publish GitHub pre-release
        shell: pwsh
        run: |
          if (gh release view "$env:PREVIEW_TAG" --repo "$env:GITHUB_REPOSITORY" 2>$null) {
            throw "Release $env:PREVIEW_TAG already exists; refusing to overwrite it."
          }

          $installer = Get-ChildItem -LiteralPath release -File -Filter "Parlyn-Engine-Setup-*.exe"
          gh release create "$env:PREVIEW_TAG" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "$env:PREVIEW_TITLE" `
            --notes-file release/PREVIEW-NOTES.md `
            --prerelease `
            "$($installer[0].FullName)" `
            "release/Parlyn-Engine-Portable-0.5.0-beta.12-x64.zip" `
            "release/latest.yml" `
            "release/SHA256SUMS.txt"
